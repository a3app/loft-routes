name: build

on:
  schedule:
    # chnroutes2 hourly, iran-ip-ranges ~6h, ipverse daily, RockBlack whenever.
    # GitHub cannot watch a foreign repo, so we poll SHAs and rebuild when they move.
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/convert.py
      - tools/sources.json
      - overlay/**
      - catalog.json
      - .github/workflows/build.yml
  pull_request:
    paths:
      - tools/convert.py
      - tools/sources.json
      - overlay/**
      - catalog.json
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: python3 tools/convert.py --self-test
      - name: Skip if upstream SHAs match lock
        id: watch
        if: github.event_name == 'schedule'
        run: |
          set +e
          python3 tools/convert.py --check-upstream
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "upstream unchanged"
          elif [ "$code" -eq 2 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "upstream changed"
          else
            exit "$code"
          fi
      - name: Convert
        if: github.event_name != 'schedule' || steps.watch.outputs.skip != 'true'
        run: python3 tools/convert.py --out . --cache .cache
      - name: Commit lists
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.watch.outputs.skip != 'true')
        run: |
          git config user.name a3app
          git config user.email "18073785+a3app@users.noreply.github.com"
          git add -- *.bat tools/lock.json
          git rm -f --ignore-unmatch via.bat keenetic.bat ru-ru.bat keenetic-ru-ru.bat lists.md
          if git diff --cached --quiet; then
            echo "no list changes"
            exit 0
          fi
          git commit -m "lists: refresh from upstream"
          git push
